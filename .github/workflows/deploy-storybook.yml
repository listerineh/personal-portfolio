name: Build Storybook

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/stories/**'
      - 'src/components/**'
      - '.storybook/**'
      - '.github/workflows/deploy-storybook.yml'
  workflow_dispatch:

jobs:
  build-storybook:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build Storybook
        run: npm run build-storybook
      
      - name: Upload Storybook artifacts
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: public/blog/components
          retention-days: 7
      
      - name: Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 📚 Storybook Build
          
          Storybook has been built successfully.
          
          ### Location:
          - **Path:** public/blog/components
          
          ### What's included:
          - ✅ Common components stories
          - ✅ Blog components stories
          - ✅ Theme switcher integration
          
          ### Environment:
          - **Branch:** ${{ github.ref_name }}
          
          ### Note:
          Storybook files are built to public/blog/components and will be included in the main Vercel deployment.
          Access at: https://listerineh.dev/blog/components
          
          EOF
