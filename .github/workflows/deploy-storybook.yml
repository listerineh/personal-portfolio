name: Verify Storybook Build

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'src/stories/**'
      - 'src/components/**'
      - '.storybook/**'
      - '.github/workflows/deploy-storybook.yml'
  workflow_dispatch:

jobs:
  verify-storybook:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build Storybook
        run: npm run build-storybook
      
      - name: Summary
        if: always()
        run: |
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ## 📚 Storybook Build Verification
          
          Storybook build verification completed.
          
          ### What's included:
          - ✅ Common components stories
          - ✅ Blog components stories
          - ✅ Theme switcher integration
          
          ### Environment:
          - **Branch:** ${{ github.ref_name }}
          
          ### Note:
          Storybook is now built as part of the main deployment via prebuild script.
          Static files will be available at: https://listerineh.dev/docs/components
          
          EOF
